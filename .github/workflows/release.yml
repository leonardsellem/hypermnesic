name: release

# Publish the hypermnesic engine to PyPI via OIDC Trusted Publishing.
#
# Trusted Publishing exchanges a short-lived GitHub OIDC token for a PyPI upload
# token at run time — there is NO long-lived PyPI API token stored in repo secrets
# (honours the "never echo secrets" rule in AGENTS.md / CONTRIBUTING.md).
#
# One-time operator setup (see PR / LS-1684) before this can publish:
#   1. Create the `hypermnesic` project on PyPI, OR add a *pending* Trusted Publisher.
#   2. On PyPI → project → Publishing, add a Trusted Publisher with:
#        owner            = leonardsellem
#        repository       = hypermnesic
#        workflow         = release.yml
#        environment      = pypi            (must match the `environment:` below)
#   3. First publish: push a version tag (e.g. `v0.1.0`) or run this workflow via
#      "Run workflow" (workflow_dispatch). The build version comes from pyproject.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify version consistency (pyproject ↔ manifests ↔ __init__)
        run: uv run python scripts/check_version_consistency.py

      - name: Build distributions
        run: uv build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hypermnesic
    permissions:
      id-token: write # OIDC token for Trusted Publishing — no stored API token
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create the GitHub Release
    needs: publish # only announce a version that actually reached PyPI
    if: startsWith(github.ref, 'refs/tags/v') # nothing to announce on a manual dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release; the other jobs stay read-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags + history, so `git describe` can find the previous tag

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Notes come from CHANGELOG.md, which AGENTS.md already makes mandatory for any
      # user-visible change — so they cannot drift from the record the way a
      # hand-written release body does. Missing section => non-zero exit => no release.
      - name: Build release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          python scripts/changelog_section.py "$GITHUB_REF_NAME" > notes.md
          {
            echo "Install: \`uv tool install hypermnesic\` · [PyPI ${version}](https://pypi.org/project/hypermnesic/${version}/) · [Full changelog](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)"
            echo
            cat notes.md
            if [ -n "$previous" ]; then
              echo
              echo "**Full diff**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            dist/*
