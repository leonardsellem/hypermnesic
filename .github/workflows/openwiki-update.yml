name: OpenWiki Update

# The daily schedule is DISABLED, and re-enabling it will not work as-is.
#
# Why (historical, then current): a CLAUDE.md symlink to AGENTS.md used to make
# OpenWiki's code-mode setup write two different snippets through one inode,
# corrupting the managed markers and aborting ("markers are malformed or
# duplicated"). That symlink is gone — this repo tracks AGENTS.md only. OpenWiki
# still writes a CLAUDE.md alongside AGENTS.md, which must never be committed:
# the "Drop CLAUDE.md recreated by OpenWiki" step below removes it and fails the
# run if a tracked one survives.
#
# To re-enable the schedule: run `workflow_dispatch` once and confirm the refresh
# PR contains only `openwiki/` changes with no CLAUDE.md, then restore:
#   schedule:
#     - cron: "0 8 * * *"
#
# workflow_dispatch is kept so the verification can be done with one manual run.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        run: npm install --global openwiki@0.6.0 mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENWIKI_MODEL_ID: "gpt-5.6-terra"
          OPENWIKI_PAGE_CONCURRENCY: "3"

      - name: Drop CLAUDE.md recreated by OpenWiki
        run: |
          git ls-files --others --modified --cached | grep -E '(^|/)CLAUDE\.md$' | grep -v '^\.agents/skills/' | xargs -r git rm -f --cached --ignore-unmatch
          find . -path ./.agents -prune -o -name CLAUDE.md -print -exec rm -f {} +
          ! git ls-files -z | grep -zEv '(^|/)\.agents/skills/' | grep -zE '(^|/)(\.claude/)?CLAUDE(\.local)?\.md$'

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # AGENTS.md / CLAUDE.md stay out of add-paths: the managed block is
          # maintained in-repo, and a CLAUDE.md an OpenWiki run recreates is
          # dropped by the step above (it is a defect, never committed).
          add-paths: |
            openwiki
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
