name: OpenWiki Update

# The daily schedule is DISABLED, and re-enabling it will not work as-is.
#
# Why: CLAUDE.md is a symlink to AGENTS.md (deliberately — see the note at the top
# of AGENTS.md). OpenWiki's code-mode setup prepares two different managed snippets,
# a full block for AGENTS.md and a short pointer stub for CLAUDE.md, then writes them
# concurrently. Both resolve to the same inode, so the writes interleave and leave a
# duplicated <!-- OPENWIKI:END --> marker. `openwiki code --update` runs that setup
# more than once per invocation, so the second call reads the file it just corrupted
# and aborts with:
#
#   Cannot update AGENTS.md because its OpenWiki managed markers are malformed or
#   duplicated.
#
# This is deterministic, not a flaky race, and it fires ~2s in — before any model
# call. Run 32972848563 failed exactly this way on 2026-08-26. The repository's
# committed AGENTS.md is and remains correct; the corruption only ever exists inside
# the runner's checkout.
#
# Until this is fixed, wiki updates are driven manually through the OpenWiki MCP
# lifecycle (openwiki_begin -> submit_plan -> next_page/submit_page -> finish), which
# hits the same setup bug but only once per invocation — so it corrupts AGENTS.md
# without failing, and the block must be repaired before the next run.
#
# To re-enable the schedule, first do ONE of:
#   1. Replace the CLAUDE.md symlink with a real file (verified stable and idempotent
#      across repeated setup calls) and update the symlink note in AGENTS.md.
#   2. Land an upstream fix that dedupes writeCodeModeAgentSnippets targets by
#      resolved inode, and pin that OpenWiki version below.
# Then restore:
#   schedule:
#     - cron: "0 8 * * *"
#
# workflow_dispatch is kept so the fix can be verified with one manual run. Expect it
# to fail at the "Run OpenWiki" step until one of the above is done.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        run: npm install --global openwiki@0.4.0 mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENWIKI_MODEL_ID: "gpt-5.6-terra"

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # AGENTS.md / CLAUDE.md are deliberately excluded: CLAUDE.md is a symlink to
          # AGENTS.md, so OpenWiki's setup step writes both snippets into the same inode
          # and leaves duplicated OPENWIKI markers. The managed block is already correct
          # in the repo, so keep that corruption inside the runner's checkout rather than
          # committing it here.
          add-paths: |
            openwiki
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
