name: ci

on:
  push:
    branches: [main, dev] # dev is the integration branch; main only takes releases
  pull_request:

jobs:
  lint-test-license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync (dev extras)
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Version consistency (pyproject ↔ manifests ↔ __init__)
        run: uv run python scripts/check_version_consistency.py
      - name: Tests
        run: uv run pytest
      - name: License gate (zero AGPL/GPL/SSPL)
        run: uv run python scripts/license_scan.py
      - name: Preflight public scan (no operator secret/host in the to-be-public surface)
        run: uv run python scripts/preflight_public_scan.py

  fresh-install:
    # What a user actually gets. Every job above runs inside uv.lock, which is NOT
    # shipped in the wheel or sdist — so none of them can see a dependency resolving
    # to a breaking major. That is exactly how mcp 2.0.0 (which removed
    # mcp.server.fastmcp) reached users as a crash-looping install: LS-2550.
    name: Fresh install from the built package (no lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist + wheel
        run: uv build

      - name: Install the wheel into a clean env, resolved from PyPI
        run: |
          uv venv /tmp/fresh
          # No --frozen, no uv.lock: dependencies resolve the way a user's would.
          VIRTUAL_ENV=/tmp/fresh uv pip install dist/*.whl

      - name: Report the resolved runtime dependencies
        run: VIRTUAL_ENV=/tmp/fresh uv pip list

      - name: The server must actually import and start
        run: |
          # Importing mcp_server is the exact line that failed on mcp 2.x.
          /tmp/fresh/bin/python -c "from hypermnesic import mcp_server; print('mcp_server import OK')"
          /tmp/fresh/bin/hypermnesic --version
          /tmp/fresh/bin/hypermnesic serve --help > /dev/null
          echo "fresh install starts"
